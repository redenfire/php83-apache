# Configurazione Apache applicata a livello globale (conf-enabled).
# Viene inclusa in coda ad apache2.conf, quindi sovrascrive il blocco
# <Directory /var/www/> originale.

# --- AllowOverride: rende effettivi gli .htaccess -------------------------
# "All" consente a .htaccess di usare rewrite, header, Require/Deny,
# ErrorDocument, Options, ecc. Limitato al document root: NON viene
# applicato a "/" o "/usr/share".
<Directory /var/www/>
    AllowOverride All
    Require all granted
</Directory>

# --- Blocchi di sicurezza di default --------------------------------------
# Questi blocchi valgono per tutto il document root; un .htaccess può
# comunque restringere ulteriormente (o, se serve, riaprire un file).

# Nega l'accesso ai file .htaccess/.htpasswd stessi
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

# Nega i file nascosti (es. .env, .git, .DS_Store, ...)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Nega file sensibili comuni: variabili d'ambiente, log, database,
# backup, file temporanei, metadati di progetto/composer.
<FilesMatch "(^\.env.*|\.(env|ini|log|sql|sqlite|db|bak|old|orig|swp|dist|lock)$|composer\.(json|lock)$|package(-lock)?\.json$|README|LICENSE|CHANGELOG|Dockerfile|docker-compose)" >
    Require all denied
</FilesMatch>

# Nega accesso alla cartella .git
RedirectMatch 404 "(?i)/\.git(/|$)"

# Nasconde la versione di Apache/PHP
ServerSignature Off
